# Builds the add-on image natively for each architecture and pushes it to GHCR.
# Home Assistant pulls these images only once config.yaml sets
#   image: "ghcr.io/pavlohuk/{arch}-addon-soulsleek_downloader"
# Without it, every installation still builds the Dockerfile locally.
name: Publish images

on:
  push:
    branches: [main]
    paths: ["soulsleek_downloader/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Read add-on version and base image
        id: meta
        run: |
          echo "version=$(sed -n 's/^version: *"\(.*\)"/\1/p' soulsleek_downloader/config.yaml)" >> "$GITHUB_OUTPUT"
          echo "base=$(sed -n 's/^ *${{ matrix.arch }}: *"\(.*\)"/\1/p' soulsleek_downloader/build.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: soulsleek_downloader
          push: true
          build-args: |
            BUILD_FROM=${{ steps.meta.outputs.base }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-soulsleek_downloader:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-soulsleek_downloader:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
