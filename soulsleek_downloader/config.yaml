name: "Soulsleek Downloader"
version: "0.6.0"
slug: "soulsleek_downloader"
description: "Downloads Spotify playlist tracks from Soulseek with YouTube fallback, then normalizes and saves them."
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
map:
  - ssl
  - share:rw
  - media:rw
full_access: true
options:
  spotify_playlist_url: ""
  output_directory: "/media/"
  soulseek_user: ""
  soulseek_pass: ""
  preferred_format: "mp3"
  youtube_fallback: true
schema:
  spotify_playlist_url: "str"
  output_directory: "str"
  soulseek_user: "str"
  soulseek_pass: "password"
  preferred_format: "str"
  youtube_fallback: "bool?"
